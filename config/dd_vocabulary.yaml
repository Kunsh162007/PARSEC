# Reference vocabulary for due diligence requests, compiled from the public sources listed under `sources`.
# It is NOT a checklist. Nothing here decides what a file needs: the model decides that from the documents, and may
# borrow a standard name from this list when one fits. Items are never added because they appear here.
# Workstream ids are consumed by the review UI; keep them exactly as written.

sources:
  - https://carta.com/wp-content/uploads/2023/03/Sample-due-diligence-request-list.pdf
  - https://files.klgates.com/files/uploads/documents/ma_event/rtac-acc_cle_sampleduediligencelist.pdf
  - https://pro.bloomberglaw.com/insights/contracts/ma-due-diligence-checklist
  - https://cassels.com/wp-content/uploads/ScheduleA-DueDiligenceRequestList_CasselsCPD.pdf
  - https://www.americanbar.org/groups/young_lawyers/resources/after-the-bar/practice-areas/conducting-legal-due-diligence-in-ma-transactions
  - https://www.smartsheet.com/sites/default/files/IC-M-and-A-Buyer-Due-Diligence-Checklist-Template-10584_PDF.pdf
  - https://www.govern365.com/blog/ma/ma-due-diligence-checklist
  - https://www.kroll.com/en/publications/critical-role-proof-cash-reconciliation-financial-due-diligence
  - https://www.v7labs.com/blog/quality-of-earnings-analysis
  - https://www.plantemoran.com/explore-our-thinking/insight/2025/04/navigating-state-and-local-tax-nexus-issues-during-ma-due-diligence
  - https://www.bdemerson.com/article/soc-2-cybersecurity-ma-due-diligence
  - https://www.praetorian.com/security-101/ma-cybersecurity-due-diligence
  - https://www.thompsoncoburn.com/insights/due-diligence-checklist-for-commercial-real-estate-acquisitions-2
  - https://impactbuying.com/environmental-due-diligence
  - https://www.neotas.com/esg-due-diligence-checklist-for-m-and-a-transactions
  - https://www.descartes.com/resources/knowledge-center/how-export-compliance-due-diligence-can-mitigate-compliance-risks
  - https://www.venable.com/insights/publications/ip-quick-bytes/intellectual-property-due-diligence-red-flags
  - https://www.upcounsel.com/ip-due-diligence-checklist
  - https://soteriahr.com/hr-due-diligence-checklist

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parsec"
version = "3.0.0"
description = "Due-diligence co-pilot that spends compute the way a senior analyst spends attention"
authors = [{ name = "PARSEC Team" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "python-multipart>=0.0.9",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

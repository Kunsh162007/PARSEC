# Render Blueprint: New > Blueprint > pick this repository. Free plan (512 MB is enough: the server peaks at about
# 175 MB; PDF pages, OCR and the review page's rules run in the visitor's browser). Secrets are asked for on setup.
services:
  - type: web
    name: fineprint
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/Dockerfile
    dockerContext: .
    envVars:
      - key: NEBIUS_API_KEY        # Nemotron on Nebius Token Factory
        sync: false
      - key: TAVILY_API_KEY        # optional: public-source checks
        sync: false
      - key: REVIEW_API_TOKEN      # optional site-wide access code; leave empty for an open demo (budget still caps spend)
        sync: false
      - key: REVIEW_DAILY_BUDGET_USD
        value: "2.0"
      - key: RULES_CONCURRENCY     # two rules runs at once keeps the worst case well under 512 MB
        value: "2"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,127.0.0.1,localhost"
      - key: DEALS_DIR
        value: /tmp/deals
      - key: DEAL_UPLOADS          # visitors can add their own folder or files as a new deal
        value: "on"
      - key: DATABASE_URL          # optional PostgreSQL (e.g. Neon's free plan): uploads and reviews survive sleep
        sync: false
